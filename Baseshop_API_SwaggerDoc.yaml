openapi: 3.0.3
info:
  title: SPIRAL EasyOrder 4.0 App - CENTAURI Baseshop API
  version: "5.74"
  description: |
    API Dokumentation für die SPIRAL EasyOrder 4.0 App.

    **Authentifizierung:** Es gibt kein klassisches Auth-Schema. Die meisten Endpunkte
    erwarten `Username` und `Password` im Request-Body (bei GET-Endpunkten als Query-Parameter).

    Der Token aus `/AutoConfig` bzw. `/Login` wird nicht als Header-Auth verwendet, sondern
    als Wert im Feld `Password` übertragen. Der Server versucht zuerst den Passwort-Login und
    validiert `Password` danach als Token.

    Optional wird ein `Authorization`-Header ausgewertet: Ist er gesetzt, wird sein Wert als
    Token validiert und `Password` ignoriert. `Username` ist dann trotzdem Pflicht.
servers:
  - url: https://{host}/API
    variables:
      host:
        default: shop.spiral.at
tags:
  - name: Auth
  - name: Produkte
  - name: Warenkorb
  - name: Bestellungen
  - name: Kunde
  - name: Nachrichten
  - name: Sonstiges
paths:
  /Login:
    post:
      tags: [Auth]
      summary: Anmeldung und Token-Erzeugung (Password darf auch ein Token sein)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
  /GetProductStock:
    get:
      tags: [Produkte]
      summary: Lagerbestand mehrerer Artikel
      parameters:
        - name: items
          in: query
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items: { type: string }
      responses:
        '200':
          description: Artikelnummer zu Lagermenge
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer }
  /ProduktDetailLangtextApp:
    get:
      tags: [Produkte]
      summary: Langtext eines Artikels als HTML
      parameters:
        - name: itemnr
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: HTML Partial
          content:
            text/html:
              schema: { type: string }
        '404':
          description: Artikel nicht gefunden
  /Product:
    post:
      tags: [Produkte]
      summary: Artikeldetails mit Anmeldung
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtendedProductResponse' }
  /Products:
    post:
      tags: [Produkte]
      summary: Alle Artikel (paginiert, taeglich gecacht je Kunde)
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Count'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductsResponse' }
  /SearchProducts:
    post:
      tags: [Produkte]
      summary: Artikelsuche (mode 0) oder Scan per Artikelnummer/EAN (mode 1)
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
        - name: suchtext
          in: query
          required: true
          schema: { type: string }
        - name: mode
          in: query
          schema: { type: integer, default: 0, enum: [0, 1] }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductsResponse' }
        '400':
          description: Suchtext fehlt
  /ProductsInOrderHistory:
    post:
      tags: [Produkte]
      summary: Bereits bestellte Artikel des Kunden
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
        - name: suchbegriff
          in: query
          schema: { type: string, default: '' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductsResponse' }
  /CategoryProducts:
    post:
      tags: [Produkte]
      summary: Artikel einer Kategorie
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
        - name: id
          in: query
          description: Kategorie-Id, 0 = oberste Kategorie
          schema: { type: integer, default: 0 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK (Anonymous Type im Code)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        Artikelnummer: { type: string }
                        Artikelname: { type: string }
                        Preis: { type: string }
        '401':
          description: Nicht autorisiert
  /Order:
    post:
      tags: [Bestellungen]
      summary: Bestellung aus uebergebenen Positionen erstellen
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
  /AddToCart:
    post:
      tags: [Warenkorb]
      summary: Positionen in den Warenkorb legen (Vorbestellung)
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
  /ShippingMethod:
    get:
      tags: [Bestellungen]
      summary: Versandarten des Kunden
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
        - name: Username
          in: query
          schema: { type: string }
        - name: Password
          in: query
          description: Passwort oder Token
          schema: { type: string }
      responses:
        '200':
          description: OK (Anonymous Type im Code)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  Shippings:
                    type: array
                    items:
                      type: object
                      properties:
                        Caption: { type: string }
                        id: { type: integer }
                        name: { type: string }
        '401':
          description: Nicht autorisiert
  /Payment:
    get:
      tags: [Bestellungen]
      summary: Zahlungsarten des Kunden
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
        - name: Username
          in: query
          schema: { type: string }
        - name: Password
          in: query
          description: Passwort oder Token
          schema: { type: string }
      responses:
        '200':
          description: OK (Anonymous Type im Code)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  payments:
                    type: array
                    items:
                      type: object
                      properties:
                        Name: { type: string }
                        NoPayment: { type: boolean }
                        IsDefault: { type: boolean }
                        Id: { type: integer }
        '401':
          description: Nicht autorisiert
  /Countries:
    post:
      tags: [Sonstiges]
      summary: Liste der Laender
      responses:
        '200':
          description: OK (Anonymous Type im Code)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  countries:
                    type: array
                    items:
                      type: object
                      properties:
                        iso: { type: string }
                        name: { type: string }
  /GetSettings:
    post:
      tags: [Kunde]
      summary: Einstellungen des Kunden lesen
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsResponse' }
  /SetSettings:
    post:
      tags: [Kunde]
      summary: Einstellungen des Kunden setzen
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsResponse' }
  /AutoConfig:
    post:
      tags: [Auth]
      summary: Automatische App-Konfiguration per Guid (liefert Username und Token)
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoConfigResponse' }
  /Inquiry:
    post:
      tags: [Kunde]
      summary: Anfrage erstellen
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InquiryRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InquiryResponse' }
  /MakeContact:
    post:
      tags: [Kunde]
      summary: Rueckrufwunsch/Kontaktanfrage
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactResponse' }
  /MyBookmarks:
    post:
      tags: [Kunde]
      summary: Merkliste des Kunden
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookmarksRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookmarksResponse' }
  /SampleShoppingCarts:
    post:
      tags: [Warenkorb]
      summary: Gespeicherte Musterwarenkoerbe
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SampleCartRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SampleCartResponse' }
  /Inventories:
    post:
      tags: [Kunde]
      summary: Kundenlager abfragen
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryResponse' }
  /OrderCustomerStock:
    post:
      tags: [Bestellungen]
      summary: Kundenlager nachbestellen (noch nicht implementiert - TODO im Code)
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerStockRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerStockResponse' }
  /Orders:
    post:
      tags: [Bestellungen]
      summary: Bestellhistorie (Firmenadmin sieht alle Bestellungen der Firma)
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrdersRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdersResponse' }
  /RegisterForNotifications:
    post:
      tags: [Kunde]
      summary: Push-Token registrieren
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
  /UnRegisterForNotifications:
    post:
      tags: [Kunde]
      summary: Push-Token entfernen
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
  /ChangeCart:
    post:
      tags: [Warenkorb]
      summary: Position im offenen Warenkorb hinzufuegen, aendern oder loeschen (Loeschen = Count 0)
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeCartRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeCartResponse' }
  /GetCurrentCart:
    post:
      tags: [Warenkorb]
      summary: Aktuellen offenen Warenkorb abrufen und validieren
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GetCurrentCartResponse' }
  /SyncOrder:
    post:
      tags: [Bestellungen]
      summary: Offenen Warenkorb bestellen
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
  /SyncAddToCart:
    post:
      tags: [Warenkorb]
      summary: Redirect-URL zum offenen Warenkorb liefern
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
  /DeliveryAddresses:
    post:
      tags: [Kunde]
      summary: Lieferadressen des Kunden (erste ist Standardadresse mit Id 0)
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryAddressesResponse' }
        '400':
          description: Fehler
  /UploadMessageAttachment:
    post:
      tags: [Nachrichten]
      summary: Anhang hochladen (jpg, png, gif, pdf)
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                Username: { type: string }
                Password: { type: string }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Hochgeladen (Anonymous Type im Code)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ImageUrl: { type: string }
                  success: { type: boolean }
        '400':
          description: Datei fehlt, zu viele Dateien oder Endung nicht erlaubt
        '500':
          description: Fehler (Anonymous Type im Code)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  success: { type: boolean }
  /SendMessage:
    post:
      tags: [Nachrichten]
      summary: Nachricht senden
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: subject
          in: query
          required: true
          schema: { type: string }
        - name: body
          in: query
          required: true
          schema: { type: string }
        - name: cartId
          in: query
          schema: { type: string, format: uuid }
        - name: attachment
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '201':
          description: Gesendet (Anonymous Type im Code)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        '400':
          description: Ungueltige Parameter
        '500':
          description: Fehler (Anonymous Type im Code)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  success: { type: boolean }
  /ValidateCheckout:
    post:
      tags: [Bestellungen]
      summary: Checkout validieren (Kostenstelle, Bestellreferenz, Verfuegbarkeit)
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidateCheckoutRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidateCheckoutResponse' }
  /CalculateCart:
    post:
      tags: [Warenkorb]
      summary: Warenkorbwerte berechnen
      parameters:
        - $ref: '#/components/parameters/OptionalAuthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalculateCartRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalculateCartResponse' }
components:
  parameters:
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }
    Count:
      name: count
      in: query
      schema: { type: integer, default: 2147483647 }
    OptionalAuthToken:
      name: Authorization
      in: header
      required: false
      description: Optional. App-Token als Alternative zum Passwort. Username bleibt Pflicht im Body.
      schema: { type: string }
  schemas:
    ColorSizeTypes:
      type: integer
      enum: [0, 1, 2]
      x-enum-varnames: [Text, Color, Dropdown]
    AccountingTypes:
      type: integer
      enum: [0, 1]
      x-enum-varnames: [Text, Dropdown]
    StockStates:
      type: integer
      enum: [0, 1, 2, 3, 4]
      x-enum-varnames: [NoInformationAvailable, NotVisible, OnStock, LowStock, NoStock]
    LoginRequest:
      type: object
      properties:
        Username: { type: string }
        Password:
          type: string
          description: Passwort oder Token aus /Login bzw. /AutoConfig
    ButtonResponse:
      type: object
      properties:
        Caption: { type: string }
        Action: { type: string }
    LoginResponse:
      type: object
      properties:
        Success: { type: boolean }
        Message: { type: string }
        Customernr: { type: string }
        Company: { type: string }
        Firstname: { type: string }
        Lastname: { type: string }
        ERPCustomernr: { type: string }
        IsAllowedUser: { type: boolean }
        Token: { type: string }
        LButton: { $ref: '#/components/schemas/ButtonResponse' }
        RButton: { $ref: '#/components/schemas/ButtonResponse' }
        Buttons:
          type: array
          items: { $ref: '#/components/schemas/ButtonResponse' }
        BudgetItemPrice: { type: number, format: decimal }
        BudgetOrderSum: { type: number, format: decimal }
        BudgetPeriodeSum: { type: number, format: decimal }
    ProductRequest:
      type: object
      properties:
        Username: { type: string }
        Password:
          type: string
          description: Passwort oder Token
        Id: { type: string }
    ProductVariationResponse:
      type: object
      properties:
        Stockno: { type: string }
        Availability: { type: string }
        Availability2: { type: string }
        Color: { type: string }
        Size: { type: string }
    ProductResponseProduct:
      type: object
      properties:
        AmountDefault: { type: integer, nullable: true }
        AmountInterval: { type: integer, nullable: true }
        AmountLocked: { type: boolean }
        AmountMin: { type: integer }
        AuxiliaryText1: { type: string }
        AuxiliaryText2: { type: string }
        Availability: { type: string }
        Availability2: { type: string }
        Brand: { type: string }
        Bullet1: { type: string }
        Bullet2: { type: string }
        Bullet3: { type: string }
        Bullet4: { type: string }
        Bullet5: { type: string }
        Bullets:
          type: array
          items: { type: string }
        BuyerName: { type: string }
        BuyerName1: { type: string }
        BuyerName2: { type: string }
        BuyerStockno: { type: string }
        BuyerUnit: { type: string }
        Color: { type: string }
        ColorArray:
          type: array
          items: { type: string }
        ColorName: { type: string }
        ColorType: { $ref: '#/components/schemas/ColorSizeTypes' }
        ComparePrice: { type: number }
        ComparePriceUnit: { type: string }
        ContainsDownloadable: { type: boolean }
        Content: { type: number, nullable: true }
        ContentUnit: { type: string }
        CountryOfOrigin: { type: string }
        Created: { type: string, format: date-time }
        CustomsCode: { type: string }
        Description: { type: string }
        Description2: { type: string }
        DetailImages:
          type: array
          items: { type: string }
        Downloadable: { type: boolean }
        EAN: { type: string }
        Episode: { type: integer }
        ListPrice: { type: number }
        Locked: { type: boolean }
        Manufacturer: { type: string }
        Manufacturerno: { type: string }
        Name1: { type: string }
        Name2: { type: string }
        OfferPrice: { type: number, nullable: true }
        PreviewImage: { type: string }
        Price: { type: number }
        BulkPrices:
          type: object
          additionalProperties: { type: number }
        PriceInfo:
          type: array
          items: { type: string }
        ReleaseDate: { type: string, format: date-time }
        Seller: { type: string }
        Series: { type: string }
        Size: { type: string }
        SizeArray:
          type: array
          items: { type: string }
        SizeName: { type: string }
        SizeType: { $ref: '#/components/schemas/ColorSizeTypes' }
        Specification: { type: string }
        Stock: { type: integer }
        StockStatus: { $ref: '#/components/schemas/StockStates' }
        Stockno: { type: string }
        Teaser: { type: string }
        Unit: { type: string }
        UnitPrice: { type: number }
        Url: { type: string }
        Vat: { type: number }
        Parent: { type: string }
        VariationsCount: { type: integer }
        Variations:
          type: array
          items: { $ref: '#/components/schemas/ProductVariationResponse' }
        Weight: { type: number }
        NotAvailable: { type: boolean }
        DiscontinuedItem: { type: boolean }
        Successor: { type: string }
